interface:
  display_name: Map OCaml types to Rust and C++
  short_description: Generate Rust and C++ types from OCaml prototypes
  default_prompt: Use $map-ocaml-types to map these OCaml declarations to Rust and
    C++ using the project's ownership model and tag-based RTTI conventions.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
